<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login | Homely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                },
            },
        },
    };
</script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex min-h-screen flex-col bg-gray-50 text-gray-800 antialiased">

<header class="border-b bg-white">
<div class="mx-auto flex max-w-6xl items-center px-5 py-4">
<a class="flex items-center gap-2 text-lg font-bold text-gray-900" href="index.html"><i data-lucide="wrench" class="h-5 w-5 text-yellow-600"></i>Homely</a>
</div>
</header>

<main class="flex flex-1 items-center justify-center px-5 py-16">
<div class="w-full max-w-sm rounded-lg border bg-white p-6 shadow-sm">
<div class="text-center">
<div class="mx-auto mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-yellow-50 text-yellow-600"><i data-lucide="user-round" class="h-5 w-5"></i></div>
<h1 class="text-3xl font-bold text-gray-900">Welcome back</h1>
<p class="mt-1 text-sm text-gray-500">Sign in to book services and track your orders.</p>
</div>

<form class="mt-6" id="login-form">
<label class="mb-3 block text-sm font-medium text-gray-700">Email
<div class="relative mt-1">
<i data-lucide="mail" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"></i>
<input class="w-full rounded-md border py-2 pl-9 pr-3 text-sm focus:outline-yellow-400" name="email" type="email" placeholder="you@example.com" required>
</div>
</label>
<label class="mb-1 block text-sm font-medium text-gray-700">Password
<div class="relative mt-1">
<i data-lucide="lock" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"></i>
<input class="w-full rounded-md border py-2 pl-9 pr-9 text-sm focus:outline-yellow-400" name="password" type="password" minlength="6" placeholder="******" required id="login-password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" id="toggle-password" type="button" aria-label="Show password"><i data-lucide="eye" class="h-4 w-4"></i></button>
</div>
</label>
<label class="mb-4 mt-3 flex items-center gap-2 text-sm text-gray-600">
<input class="rounded border-gray-300 text-yellow-600 focus:ring-yellow-400" name="rememberMe" type="checkbox" id="remember-me" checked>
Remember me
</label>
<p class="mb-3 min-h-4 text-xs text-red-600" id="login-message"></p>
<button class="flex w-full items-center justify-center gap-2 rounded-md bg-yellow-600 py-2.5 text-sm font-medium text-white hover:bg-yellow-700 disabled:opacity-60" type="submit" id="login-submit">Sign in</button>
</form>

<p class="mt-5 text-center text-sm text-gray-500">Don't have an account? <a class="font-medium text-yellow-600 hover:underline" href="register.html">Register</a></p>
</div>
</main>

<script>
const API_BASE = "http://localhost:5000/api";
lucide.createIcons();

const passwordInput = document.querySelector("#login-password");
document.querySelector("#toggle-password").addEventListener("click", (event) => {
    const showing = passwordInput.type === "text";
    passwordInput.type = showing ? "password" : "text";
    event.currentTarget.innerHTML = showing ? '<i data-lucide="eye" class="h-4 w-4"></i>' : '<i data-lucide="eye-off" class="h-4 w-4"></i>';
    lucide.createIcons();
});

document.querySelector("#login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const formData = new FormData(event.target);
    const payload = { email: formData.get("email"), password: formData.get("password") };
    const rememberMe = document.querySelector("#remember-me").checked;
    const submitBtn = document.querySelector("#login-submit");
    const message = document.querySelector("#login-message");
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";
    message.textContent = "";
    try {
        const response = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.errors?.[0]?.message || "Please check your details.");

        const storage = rememberMe ? localStorage : sessionStorage;
        const otherStorage = rememberMe ? sessionStorage : localStorage;
        storage.setItem("fixitToken", data.token);
        storage.setItem("fixitUser", JSON.stringify(data.user));
        otherStorage.removeItem("fixitToken");
        otherStorage.removeItem("fixitUser");

        const returnTo = sessionStorage.getItem("fixitReturnTo") || "index.html";
        sessionStorage.removeItem("fixitReturnTo");
        window.location.href = returnTo;
    } catch (error) {
        message.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
    }
});
</script>
</body>
</html>
