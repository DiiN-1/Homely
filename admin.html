<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Homely</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid #facc15; outline-offset: 2px; }</style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 antialiased">
<header class="border-b bg-white">
<div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
<a class="flex items-center gap-2 text-lg font-bold text-gray-900" href="index.html"><i data-lucide="wrench" class="h-5 w-5 text-yellow-600"></i>Homely <span class="rounded bg-gray-900 px-1.5 py-0.5 text-xs font-semibold text-white">Admin</span></a>
<a class="text-sm font-medium text-gray-600 hover:text-yellow-600" href="index.html">Back to site</a>
</div>
</header>

<main class="mx-auto max-w-6xl px-5 py-10">
<div class="flex flex-wrap items-center justify-between gap-3">
<h1 class="text-2xl font-bold text-gray-900">Manage orders &amp; bookings</h1>
<div class="flex rounded-md border bg-white p-1 text-sm font-medium" role="tablist">
<button class="rounded px-4 py-1.5" id="tab-orders" type="button" role="tab">Orders</button>
<button class="rounded px-4 py-1.5" id="tab-bookings" type="button" role="tab">Bookings</button>
</div>
</div>
<p class="mt-2 min-h-5 text-sm text-red-600" id="admin-message" role="alert"></p>
<div class="mt-4 space-y-4" id="admin-list"><p class="text-sm text-gray-500">Loading...</p></div>
</main>

<script src="shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
